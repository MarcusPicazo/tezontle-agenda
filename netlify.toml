[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Página pública de cada vendedor: /demo/<enlace> sirve /demo/index.html y el script lee el enlace.
[[redirects]]
  from = "/demo/*"
  to = "/demo/index.html"
  status = 200
